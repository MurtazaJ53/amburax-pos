version: '3.8'

services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=100
    ports:
      - "6432:5432"
    depends_on:
      - db
    restart: always

  db:
    # Plain Postgres, deliberately - and this used to say citusdata/citus:12.1.
    #
    # Citus can spread one table across machines by a key, and shop id is
    # exactly the shape this data has. But no table was ever distributed, so
    # the extension did nothing except sit in the image, and the droplet does
    # not even run this file: scripts/go-live/deploy.sh picks the first compose
    # file it finds, which is docker-compose.demo.yml, and that has always been
    # postgres:16-alpine. So "production runs Citus" was never true.
    #
    # Carrying an unused sharding extension is the one option with no upside:
    # it costs a bigger image and invites the belief that sharding is already
    # solved. If the load test says one box is not enough, turning Citus on is
    # a deliberate migration made against real numbers - put the image back
    # here, then distribute tables by shop id.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-business_hub}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
      # Product photos. "filesystem" keeps them in the named volume below,
      # which survives a container rebuild but lives and dies with the
      # droplet - so it MUST be in your backups. Set BLOB_STORE=s3 with the
      # BLOB_S3_* values to put them in Spaces, R2 or S3 instead, and the
      # backup question goes away with them.
      - BLOB_STORE=${BLOB_STORE:-filesystem}
      - BLOB_ROOT=/var/lib/bhub/media
      - BLOB_S3_BUCKET=${BLOB_S3_BUCKET:-}
      - BLOB_S3_ENDPOINT=${BLOB_S3_ENDPOINT:-}
      - BLOB_S3_REGION=${BLOB_S3_REGION:-}
      - BLOB_S3_ACCESS_KEY=${BLOB_S3_ACCESS_KEY:-}
      - BLOB_S3_SECRET_KEY=${BLOB_S3_SECRET_KEY:-}
    volumes:
      - media_data:/var/lib/bhub/media
    ports:
      - "8000:8000"
    depends_on:
      - pgbouncer
      - redis
    restart: always

  celery_default:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A config worker -Q default,migration,reconciliation -l info -c 4
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
    depends_on:
      - pgbouncer
      - redis
    restart: always

  celery_erpnext:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A config worker -Q erpnext-sync -l info -c 2
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
    depends_on:
      - pgbouncer
      - redis
    restart: always

  celery_beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
    depends_on:
      - redis
    restart: always

volumes:
  db_data:
  redis_data:
  # Product photos when BLOB_STORE=filesystem. Back this up: unlike the
  # database it has no dump, and losing it loses every picture.
  media_data:
