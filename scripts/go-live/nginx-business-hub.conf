# nginx site for Business Hub.
#
# Two names on one droplet: the admin web app and the API. They are separated
# by hostname rather than by path because the browser's cookie and CORS rules
# are per-origin — running the API under /api of the same host would let any
# XSS on the admin site read the API cookies directly.
#
# Install:
#   sudo cp nginx-business-hub.conf /etc/nginx/sites-available/business-hub
#   sudo ln -sf /etc/nginx/sites-available/business-hub /etc/nginx/sites-enabled/
#   sudo sed -i 's/APP_DOMAIN/app.yourdomain.com/g; s/API_DOMAIN/api.yourdomain.com/g' \
#       /etc/nginx/sites-available/business-hub
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.yourdomain.com -d api.yourdomain.com
#
# certbot rewrites these server blocks to add the certificate lines and the
# port 80 redirect, so do not add TLS directives here by hand — run certbot and
# let it own that part.

# ---------------------------------------------------------------------------
# Admin web app (Next.js, container port 3000)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name APP_DOMAIN;

    # Receipts, spreadsheet imports and label sheets all move real files.
    # nginx's 1m default rejects a moderate product import with a bare 413 and
    # no clue as to why.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django builds absolute URLs from this. Without it, every link in a
        # password reset or a khata statement email points at http://.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# API (Django + gunicorn, container port 8000)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name API_DOMAIN;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A bulk import of several thousand rows is one request that runs for
        # a while. The 60s default cuts it off mid-write and the shopkeeper
        # sees a gateway error on a job that actually succeeded.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django serves these itself via WhiteNoise; the long cache is safe because
    # collectstatic writes hashed filenames.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
